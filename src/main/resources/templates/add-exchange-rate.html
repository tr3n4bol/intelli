<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Exchange Rate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 2rem;
    }
    .form-container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
<div class="form-container">
  <h1>Add New Exchange Rate</h1>
  <form th:action="@{/add-exchange-rate}" th:object="${exchangeRate}" method="post">
    <div>
      <label for="fromCurrency">From Currency:</label>
      <input type="text" id="fromCurrency" th:field="*{fromCurrency}" required>
    </div>
    <div>
      <label for="toCurrency">To Currency:</label>
      <input type="text" id="toCurrency" th:field="*{toCurrency}" required>
    </div>
    <div>
      <label for="rate">Rate:</label>
      <input type="number" id="rate" th:field="*{rate}" step="0.0001" required>
    </div>
    <button type="submit">Add Exchange Rate</button>
  </form>
  <a href="/converter"><button>Back to Converter</button></a>
</div>
</body>
</html>
