<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .back-button {
            margin-top: 1rem;
            text-align: center;
        }

        .back-button a {
            text-decoration: none;
            color: #007bff;
        }

        .back-button a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<h1>History of <span th:text="${username}"></span></h1>
<table>
    <thead>
    <tr>
        <th>From Currency</th>
        <th>To Currency</th>
        <th>Amount</th>
        <th>Converted Amount</th>
        <th>Timestamp</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="operation : ${operations}">
        <td th:text="${operation.fromCurrency}"></td>
        <td th:text="${operation.toCurrency}"></td>
        <td th:text="${operation.amount}"></td>
        <td th:text="${operation.convertedAmount}"></td>
        <td th:text="${operation.timestamp}"></td>
    </tr>
    </tbody>
</table>
<div class="back-button">
    <a th:if="${source == 'converter'}" href="/converter">Back to Computing</a>
    <a th:if="${source == 'users'}" href="/users">Back to Users</a>
</div>
</body>
</html>
