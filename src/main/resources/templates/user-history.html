<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 2rem;
            position: relative;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
        }

        .swap-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #6c757d;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
        }

        .hidden {
            display: none;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .highlight {
            background-color: #e0efe0;
            font-weight: bold;
            color: #81ea61;
        }

        .back-button {
            margin-top: 1rem;
            text-align: center;
        }

        .back-button a {
            text-decoration: none;
            color: #007bff;
        }

        .back-button a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<button class="swap-button" onclick="toggleTables()">Swap History</button>

<h1>History of <span th:text="${username}"></span></h1>

<!-- Таблица для конвертера валют -->
<table class="history-table" id="currencyTable">
    <thead>
    <tr>
        <th>From Currency</th>
        <th>To Currency</th>
        <th>Amount</th>
        <th>Converted Amount</th>
        <th>Timestamp</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="operation : ${operations_curr}">
        <td th:text="${operation.fromCurrency}"></td>
        <td th:text="${operation.toCurrency}"></td>
        <td th:text="${operation.amount}"></td>
        <td th:text="${operation.convertedAmount}"></td>
        <td th:text="${operation.timestamp}"></td>
    </tr>
    </tbody>
</table>

<!-- Таблица для закона Ома -->
<table class="history-table hidden" id="ohmTable">
    <thead>
    <tr>
        <th>Дата</th>
        <th>V (В)</th>
        <th>I (А)</th>
        <th>R (Ом)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="calc : ${operations_ohm}">
        <td th:text="${#temporals.format(calc.timestamp, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${calc.voltage != null} ? ${#numbers.formatDecimal(calc.voltage, 1, 2)} : '-'"
            th:class="${calc.calculationType == 'V'} ? 'highlight' : ''"></td>
        <td th:text="${calc.current != null} ? ${#numbers.formatDecimal(calc.current, 1, 2)} : '-'"
            th:class="${calc.calculationType == 'I'} ? 'highlight' : ''"></td>
        <td th:text="${calc.resistance != null} ? ${#numbers.formatDecimal(calc.resistance, 1, 2)} : '-'"
            th:class="${calc.calculationType == 'R'} ? 'highlight' : ''"></td>
    </tr>
    </tbody>
</table>

<div class="back-button">
    <a th:if="${source == 'converter'}" href="/converter">Back to Computing</a>
    <a th:if="${source == 'users'}" href="/users">Back to Users</a>
</div>

<script>
    function toggleTables() {
        const currencyTable = document.getElementById('currencyTable');
        const ohmTable = document.getElementById('ohmTable');

        currencyTable.classList.toggle('hidden');
        ohmTable.classList.toggle('hidden');

        // Обновляем текст кнопки
        const button = document.querySelector('.swap-button');
        button.textContent = currencyTable.classList.contains('hidden')
            ? 'Show Currency History'
            : 'Show Ohm Law History';
    }
</script>
</body>
</html>
